name: Node.js Package GitHub Mode

on:
  push:
    branches:
      - main
      - RELEASE
      - BETA

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/

      - name: Install dependencies
        run: npm ci

      # Read version from package.json
      - name: Read version from package.json
        id: read_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # Publish package to GitHub Packages.
      # The scope (@nekosuneprojects) matches the repo owner (NekoSuneProjects),
      # which GitHub Packages requires, and auth uses the built-in GITHUB_TOKEN.
      # `|| true` keeps re-pushes of an already-published version from failing
      # the whole run (npm rejects republishing the same version).
      - name: Publish to GitHub Packages
        run: npm publish || echo "Publish skipped (version may already exist on GitHub Packages)."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}