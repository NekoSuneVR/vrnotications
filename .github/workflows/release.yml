# ⚠️ DISABLED at the moment.
# This workflow only runs when triggered manually ("Run workflow" /
# workflow_dispatch). It will NOT post automatically yet.
#
# To enable automatic Discord posts on every published GitHub Release,
# uncomment the `release:` trigger below.
#
# Publishing is handled separately by:
#   - npm-publish.yml                 (npmjs.org)
#   - npm-publish-github-packages.yml (GitHub Packages)
# This workflow is ONLY responsible for the Discord announcement.

name: Discord Release Notification

permissions:
  contents: read

on:
  workflow_dispatch:
  # release:
  #   types: [published]

jobs:
  discord-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK)) {
            Write-Host "No DISCORD_WEBHOOK secret set — skipping Discord notification."
            exit 0
          }

          # Fall back to sensible defaults when run manually (no release payload).
          $tag   = if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG))  { "manual" } else { $env:RELEASE_TAG }
          $name  = if ([string]::IsNullOrWhiteSpace($env:RELEASE_NAME)) { "vrnotications $tag" } else { $env:RELEASE_NAME }
          $body  = if ([string]::IsNullOrWhiteSpace($env:RELEASE_BODY)) { "A new version of @nekosuneprojects/vrnotications has been released." } else { $env:RELEASE_BODY }
          $isBeta  = ($env:RELEASE_PRERELEASE -eq "true")
          $channel = if ($isBeta) { "BETA" } else { "RELEASE" }
          $color   = if ($isBeta) { 16750848 } else { 5763719 }

          $install = "npm install @nekosuneprojects/vrnotications"

          $json = @{
            username = "vrnotications Bot"
            content  = "**UPDATE ($channel)** — @nekosuneprojects/vrnotications $tag"
            embeds   = @(
              @{
                title       = $name
                url         = $env:RELEASE_URL
                description = "$body`n`n``$install``"
                color       = $color
                timestamp   = (Get-Date).ToString("o")
              }
            )
          } | ConvertTo-Json -Depth 10

          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body $json
